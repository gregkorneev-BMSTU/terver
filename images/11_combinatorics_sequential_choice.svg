<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="Последовательный выбор k различных элементов: n, n-1, n-2, ..., n-k+1">
<rect x="1" y="1" width="998" height="248" rx="16" fill="#fcfdff" stroke="#cbd5e1" stroke-width="2"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#0f172a" font-weight="bold">Размещения без повторений</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="38" y="77" width="160" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="118" y="114" font-size="30" fill="#1e40af">n</text><text x="118" y="152" font-size="17" fill="#1e3a8a">1-я позиция</text>
<rect x="244" y="77" width="160" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="324" y="114" font-size="30" fill="#1e40af">n − 1</text><text x="324" y="152" font-size="17" fill="#1e3a8a">2-я позиция</text>
<rect x="450" y="77" width="160" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="530" y="114" font-size="30" fill="#1e40af">n − 2</text><text x="530" y="152" font-size="17" fill="#1e3a8a">3-я позиция</text>
<text x="656" y="138" font-size="40" fill="#64748b">···</text>
<rect x="726" y="77" width="234" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="843" y="114" font-size="30" fill="#1e40af">n − k + 1</text><text x="843" y="152" font-size="17" fill="#1e3a8a">k-я позиция</text>
<text x="500" y="223" font-size="21" fill="#0f172a">По правилу умножения: A(n,k) = n · (n−1) · ... · (n−k+1)</text>
</g>
<g stroke="#64748b" stroke-width="2" fill="none"><path d="M198 127 H244"/><path d="M404 127 H450"/><path d="M610 127 H635"/><path d="M677 127 H726"/></g>
</svg>