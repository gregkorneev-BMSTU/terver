</text><line x1="465" y1="165" x2="665" y2="190" stroke="#d97706" stroke-width="2.6"/><text x="575" y="171.75" font-size="14" text-anchor="middle" fill="#b45309">q</text><line x1="465" y1="265" x2="665" y2="240" stroke="#2563eb" stroke-width="2.6"/><text x="575" y="244.25" font-size="14" text-anchor="middle" fill="#1d4ed8">p</text><line x1="465" y1="265" x2="665" y2="290" stroke="#d97706" stroke-width="2.6"/><text x="575" y="271.75" font-size="14" text-anchor="middle" fill="#b45309">q</text><line x1="465" y1="365" x2="665" y2="340" stroke="#2563eb" stroke-width="2.6"/><text x="575" y="344.25" font-size="14" text-anchor="middle" fill="#1d4ed8">p</text><line x1="465" y1="365" x2="665" y2="390" stroke="#d97706" stroke-width="2.6"/><text x="575" y="371.75" font-size="14" text-anchor="middle" fill="#b45309">q</text><circle cx="85" cy="215" r="12" fill="#0f172a"/><circle cx="260" cy="115" r="7" fill="#64748b"/><circle cx="260" cy="315" r="7" fill="#64748b"/><circle cx="465" cy="65" r="7" fill="#64748b"/><circle cx="465" cy="165" r="7" fill="#64748b"/><circle cx="465" cy="265" r="7" fill="#64748b"/><circle cx="465" cy="365" r="7" fill="#64748b"/><circle cx="665" cy="40" r="7" fill="#64748b"/><text x="684" y="45" font-size="15" fill="#1e293b">УУУ: p³</text><circle cx="665" cy="90" r="7" fill="#64748b"/><text x="684" y="95" font-size="15" fill="#1e293b">УУН: p²q</text><circle cx="665" cy="140" r="7" fill="#64748b"/><text x="684" y="145" font-size="15" fill="#1e293b">УНУ: p²q</text><circle cx="665" cy="190" r="7" fill="#64748b"/><text x="684" y="195" font-size="15" fill="#1e293b">УНН: pq²</text><circle cx="665" cy="240" r="7" fill="#64748b"/><text x="684" y="245" font-size="15" fill="#1e293b">НУУ: p²q</text><circle cx="665" cy="290" r="7" fill="#64748b"/><text x="684" y="295" font-size="15" fill="#1e293b">НУН: pq²</text><circle cx="665" cy="340" r="7" fill="#64748b"/><text x="684" y="345" font-size="15" fill="#1e293b">ННУ: pq²</text><circle cx="665" cy="390" r="7" fill="#6474