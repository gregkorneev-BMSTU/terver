<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" role="img" aria-label="Диаграмма условной вероятности: B как новое пространство исходов и A пересечение B как благоприятная область">
<rect x="2" y="2" width="846" height="346" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#0f172a">
<text x="32" y="38" font-size="24" font-weight="bold">Условие B: остаётся только область B</text>
<rect x="34" y="58" width="782" height="220" rx="12" fill="white" stroke="#94a3b8" stroke-width="2"/>
<text x="48" y="88" font-size="18">Ω</text>
<ellipse cx="438" cy="165" rx="225" ry="87" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
<ellipse cx="302" cy="165" rx="183" ry="92" fill="#dbeafe" opacity="0.74" stroke="#2563eb" stroke-width="3"/>
<defs><clipPath id="clipB"><ellipse cx="438" cy="165" rx="225" ry="87"/></clipPath></defs>
<ellipse cx="302" cy="165" rx="183" ry="92" fill="#0d9488" opacity="0.84" clip-path="url(#clipB)"/>
<text x="230" y="141" font-size="23" fill="#1d4ed8">A</text><text x="578" y="144" font-size="23" fill="#15803d">B</text>
<text x="363" y="176" font-size="19" fill="white" font-weight="bold">A ∩ B</text>
<text x="427" y="324" text-anchor="middle" font-size="23" font-weight="bold">P(A | B) = P(A ∩ B) / P(B),  P(B) &gt; 0</text>
</g></svg>